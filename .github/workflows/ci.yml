name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    name: lint + types + tests
    runs-on: ubuntu-latest

    services:
      db:
        # Same image as docker-compose.yml and the data server — Debian, not alpine.
        # See the compose comment: musl collates Spanish names byte-wise.
        image: postgres:18
        env:
          POSTGRES_DB: dglweb
          POSTGRES_USER: dglweb
          POSTGRES_PASSWORD: dglweb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dglweb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches config.settings.dev; points at the CI Postgres service.
      DATABASE_URL: postgres://dglweb:dglweb@localhost:5432/dglweb
      # La suite ignora DATABASE_URL a propósito (ver config/settings/test.py) y arma la conexión
      # ella misma, con el host del compose por defecto. Acá no hay red de Docker: el `service` de
      # arriba publica su puerto en el propio runner, así que el Postgres descartable es localhost.
      DGLWEB_TEST_DB_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (types)
        run: mypy .

      - name: Pytest (tests)
        run: pytest

  # ── El JavaScript, en su propio trabajo ────────────────────────────────────────────────────────
  #
  # Aparte y no dentro del anterior a propósito: no comparte NADA con él —ni Postgres, ni Python, ni
  # dependencias— y juntarlos haría que un fallo del JS obligara a releer un log donde el 95% es de
  # otra cosa. Además corren en paralelo, así que el gate no tarda más.
  #
  # Existe desde el 28-07 por FE-02 del review v6: el teclado del buscador no lo probaba nada. Se
  # aplazó mientras hubo un solo archivo de JS —el corredor costaba más que lo que protegía— y esa
  # condición dejó de cumplirse: hoy son ocho archivos y ~860 líneas, varias de ellas movidas desde
  # las plantillas al poner la CSP.
  javascript:
    name: js (vitest + jsdom)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo que dice el lock y falla si el lock y el
      # `package.json` no concuerdan, en vez de resolver por su cuenta versiones que nadie revisó.
      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test

  # ── Lo que no es Python ni JavaScript ──────────────────────────────────────────────────────────
  #
  # Siete scripts de shell y tres stacks de compose. Nada los miraba, y son los archivos con el peor
  # modo de fallo del repositorio: **nadie los ejecuta al desarrollar**, así que un error de sintaxis
  # espera hasta que lo dispare un cron o un despliegue —`respaldo.sh` a las 5:30 de la mañana,
  # `deploy/stack.yml` al recrear el stack con el sitio abajo—.
  #
  # Va en un job aparte y no dentro del gate de Python por lo mismo que el de JavaScript: tarda
  # segundos, no comparte dependencias, y un fallo acá no debe obligar a releer un log donde casi
  # todo es de otra cosa.
  #
  # El `.ps1` NO se comprueba aquí: necesita el analizador de .NET y solo existe en la máquina del
  # dueño. Lo cubre `make checkps1`, que se salta solo donde no hay PowerShell.
  operaciones:
    name: shell + stacks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # `bash -n` valida SINTAXIS, no semántica: no detecta un `awk` con una extensión de gawk ni un
      # `sed` que no casa. Para eso están las pruebas; esto es la red de abajo.
      - name: Sintaxis de los scripts
        run: |
          for f in deploy/*.sh deploy/postgres/init/*.sh deploy_dglweb_image.sh; do
            printf "  %-42s " "$f"; bash -n "$f" || exit 1; echo ok
          done

      # `config -q` valida sintaxis Y esquema. Las variables llevan valores de mentira porque los
      # `${VAR:?falta}` abortarían — y esos `:?` son deliberados, así que hay que darles algo.
      - name: Stacks de producción
        run: |
          DJANGO_SECRET_KEY=x DJANGO_ALLOWED_HOSTS=x DATABASE_URL=x MLB_PROXY_URL=x \
            MLB_PROXY_API_KEY=x WAGTAILADMIN_BASE_URL=x \
            docker compose -f deploy/stack.yml config -q
          POSTGRES_PASSWORD=x DGLWEB_DB_PASSWORD=x PGADMIN_PASSWORD=x PGADMIN_DEFAULT_EMAIL=x \
            docker compose -f deploy/postgres/stack.yml config -q
          docker compose -f deploy/adserver/stack.yml config -q
