# /etc/nginx/sites-available/promo.dominicanosengrandesligas.com
#
# El servidor de anuncios. Ver `docs/ADSERVER.md` para el plan completo.
#
# LO QUE HACE DISTINTO A ESTE SITIO DE LOS DEMÁS DEL VPS
# -------------------------------------------------------
# `pgadmin.conf` protege el sitio ENTERO con una lista blanca de IP, y está bien: ahí dentro no hay
# nada que un visitante deba ver. Acá no se puede hacer eso. Revive tiene dos mitades con necesidades
# opuestas y **la protección va por ruta, no por servidor**:
#
#   /www/admin/   el panel. Lo usan el dueño y Adcio. Lista blanca.
#   todo lo demás la entrega y las creatividades. Lo pide el navegador de CADA visitante. PÚBLICO.
#
# Protegerlo entero deja el sitio sin anuncios. Abrirlo entero expone a internet el formulario de
# acceso de un PHP con linaje de OpenX y su historial de avisos de seguridad.

server {
  listen 80;
  listen [::]:80;
  server_name promo.dominicanosengrandesligas.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    allow all;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  # `http2` COMO PARÁMETRO DE `listen`, que es la forma que entiende este nginx.
  #
  # Se intentó la forma moderna —`http2 on;`, una directiva aparte— para callar el aviso «protocol
  # options redefined for 0.0.0.0:443» que sale al recargar. **Fue un error y tumbó `nginx -t`**:
  # esa directiva existe desde nginx 1.25.1 y este servidor es anterior. El aviso, que yo tomé por
  # una señal de la versión nueva, es viejo y sale en cualquier nginx cuando varios `server`
  # comparten socket declarando las mismas opciones de protocolo.
  #
  # Lo peligroso del intento no fue el fallo en sí, sino DÓNDE deja el sistema: `nginx -t` falla, el
  # `reload` no se ejecuta, nginx sigue sirviendo con la configuración vieja en memoria… y el archivo
  # roto se queda en disco. Todo parece bien hasta el siguiente reinicio, en el que no levanta
  # NINGÚN sitio del servidor.
  #
  # El aviso es cosmético: HTTP/2 funciona. Si algún día molesta, se calla actualizando nginx y
  # cambiando TODOS los sitios a la vez, no uno.
  server_name promo.dominicanosengrandesligas.com;

  ssl_certificate     /etc/letsencrypt/live/promo.dominicanosengrandesligas.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/promo.dominicanosengrandesligas.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  # `X-Frame-Options "SAMEORIGIN"` NO VA A NIVEL DE SERVIDOR, y esto es lo que más fácil se rompe.
  #
  # Revive entrega los anuncios dentro de un `iframe` incrustado en dominicanosengrandesligas.com.
  # Para el navegador, `promo.` es OTRO ORIGEN, así que `SAMEORIGIN` le hace negarse a dibujarlos: el
  # hueco se queda en blanco y la única pista está en la consola. Se pone solo en el panel, más abajo.

  # Las creatividades pueden pesar. El defecto de nginx es 1 MB y no deja rastro en los registros de
  # la aplicación: el panel dice que la subida falló y no dice por qué.
  client_max_body_size 20M;

  # ── EL PANEL ────────────────────────────────────────────────────────────────────────────────
  #
  # VA PRIMERO. nginx elige el `location` más específico, así que el orden entre estos dos no cambia
  # nada funcionalmente — pero leerlo primero deja claro que es la excepción y no la regla.
  location /www/admin/ {
    allow 73.244.42.221;
    deny all;

    # Acá sí, y solo acá: el panel no se incrusta en ningún sitio.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # `Referrer-Policy: no-referrer` NO se pone, por la misma razón que en pgAdmin: las aplicaciones
    # PHP de esta generación validan el `Referer` en sus formularios y sin él rechazan el envío.

    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Generar un informe de un mes tarda más que los 60s por defecto, y el 504 llega sin decir de
    # quién es.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ── LA ENTREGA ──────────────────────────────────────────────────────────────────────────────
  location / {
    # Que el sitio pueda incrustar los anuncios, y NADIE MÁS.
    #
    # `frame-ancestors` y no `X-Frame-Options` porque la única forma de decir «solo este otro
    # origen» en la cabecera vieja era `ALLOW-FROM`, que ningún navegador actual implementa. Sin
    # esto, cualquier web podría incrustar tus anuncios y gastarte impresiones que le facturas a tu
    # cliente.
    add_header Content-Security-Policy "frame-ancestors https://dominicanosengrandesligas.com" always;
    add_header X-Content-Type-Options "nosniff" always;

    # SIN `limit_req` A PROPÓSITO, al revés que pgAdmin.
    #
    # Acá cada visitante genera una petición por hueco de anuncio y por página. Un límite pensado
    # para un panel de administración estrangularía el tráfico normal del sitio, y lo que se pierde
    # son impresiones facturables. Si algún día hace falta, se mide primero con `limit_req_dry_run`.
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # LA IP REAL IMPORTA MÁS ACÁ QUE EN NINGÚN OTRO SITIO DEL VPS. Revive cuenta impresiones únicas
    # y segmenta por país mirando quién pide. Sin `X-Forwarded-For` todo le llega desde 127.0.0.1:
    # un único visitante de un único país, y el informe que se le pasa al cliente no vale nada.
  }
}
