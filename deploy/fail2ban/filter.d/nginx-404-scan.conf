# El filtro de la jail `nginx-404-scan`. Va en `/etc/fail2ban/filter.d/nginx-404-scan.conf`.
#
#   sudo install -D -m 644 deploy/fail2ban/filter.d/nginx-404-scan.conf \
#                          /etc/fail2ban/filter.d/nginx-404-scan.conf
#
#
# ESTE ARCHIVO FALTABA, Y SIN ÉL LA JAIL NO ARRANCA
# ---------------------------------------------------
# `nginx-404-scan` NO es un filtro que traiga fail2ban —los suyos son `nginx-botsearch`,
# `nginx-bad-request`, `nginx-http-auth`, `nginx-limit-req`—, así que es este archivo o nada. Vivía
# solo en el VPS mientras `deploy/fail2ban/jail.d/nginx.local` y `docs/CORTAFUEGOS.md` afirmaban que la
# configuración estaba versionada. Lo levantó el review v14 (SEC-01).
#
#
# OJO: LA REGLA ACTIVA CAZA CUALQUIER 404, NO SOLO ESCÁNERES
# ------------------------------------------------------------
# El nombre de la jail dice «scan» y la regla comentada de abajo es la que hace eso — solo `/\.env`,
# `/wp-login.php`, `/phpmyadmin` y compañía. Está DESACTIVADA. La que corre casa con todo.
#
# Con `maxretry = 5` eso significa que cinco 404 en diez minutos banean 12 horas, y el baneo es de
# cortafuegos: **los seis dominios del VPS a la vez**. Un enlace roto que alguien recorra, un rastreador
# con URLs viejas, o —con el CGNAT dominicano— varios usuarios de una operadora sumando 404 entre
# todos.
#
# Se deja como está, y a conciencia: hoy los únicos 404 del log son de escáneres reales, los estáticos
# no llegan (`/static/` va con `access_log off` en `nginx-dglweb.conf`) y el dueño confirmó que
# sabertables y baseballsixdegrees no producen 404 en uso normal.
#
# PERO ES LO PRIMERO QUE HAY QUE MIRAR si alguna vez aparece un baneo raro: o se sube el `maxretry`, o
# se cambia a la regla estrecha de abajo. Y hay que revisarlo antes de publicar contenido que genere
# 404 legítimos — un cambio de rutas sin redirecciones, por ejemplo.
[Definition]

# LA REGLA ESTRECHA, la que corresponde al nombre. Solo rutas que un lector no pide jamás.
#failregex = ^<HOST> - .* "(GET|POST|HEAD) (?:/\.env|/wp-login\.php|/wp-admin|/xmlrpc\.php|/phpmyadmin|/pma|/myadmin|/\.git|/\.svn|/\.hg|/server-status|/cgi-bin|/boaform).*" 404 .*$

failregex = ^<HOST>\s+-\s+.*"\s*(GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH)\s+.*"\s+404\s+

ignoreregex =

# `\s` acá SÍ es correcto, al revés que en el `awk` de `change_nginx_allow_ip.sh`: los filtros de
# fail2ban se evalúan con el módulo `re` de Python, donde `\s` es estándar. En awk es una extensión de
# GNU y rompe con `mawk`.
