# /etc/nginx/sites-available/dominicanosengrandesligas.com
#
# Vive en el repositorio y no solo dentro del servidor: una configuración que solo existe en
# `/etc/nginx` no se puede revisar en un diff, ni comparar con lo que corría antes, ni recuperar si
# alguien la edita mal a las tres de la mañana.

# ── EL POOL DE CONEXIONES HACIA EL CONTENEDOR ────────────────────────────────────────────────────
#
# Sin esto nginx habla HTTP/1.0 con el contenedor y abre y cierra una conexión por CADA petición.
# Con `keepalive` las mantiene abiertas y las reutiliza: menos saludos TCP —así que responde algo
# más rápido— y ningún socket acumulándose en TIME_WAIT.
#
# Va FUERA de `server`, en el contexto `http`. Dentro de un `server`, nginx no arranca.
upstream dglweb {
    server 127.0.0.1:3004;
    # Conexiones ociosas guardadas POR TRABAJADOR. Con 4 trabajadores son hasta 128 abiertas contra
    # el contenedor, que las atiende de sobra.
    keepalive 32;
}

server {
    server_name dominicanosengrandesligas.com www.dominicanosengrandesligas.com;

    # ── EL CMS: solo desde la IP del dueño ────────────────────────────────────────────────────
    #
    # Wagtail y el admin de Django son formularios de acceso: sin esto, cualquiera puede probar
    # usuarios y contraseñas a ritmo de máquina contra el panel que publica el sitio.
    #
    # El `(/|$)` cubre también la URL sin barra final. Sin él, `/cms` no casa, llega a Django y su
    # redirección a `/cms/` le confirma a cualquiera que la ruta existe.
    #
    # Lo que NO se cierra, a propósito: `/static/`, sin el cual el panel carga sin estilos ni
    # JavaScript; y `/documents/`, que aunque sea de Wagtail es por donde se descargan los documentos
    # que enlaza un artículo, o sea contenido público.
    location ~ ^/(cms|django-admin)(/|$) {
        allow 73.244.42.221;
        deny all;

        proxy_pass http://dglweb;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── LOS RETRATOS DE LOS PELOTEROS ─────────────────────────────────────────────────────────
    #
    # Van fuera de la imagen de Docker a propósito: son 1.970 archivos que cambian cuando el dueño
    # corre su script de descarga, y así actualizarlos es copiar, sin reconstruir ni reiniciar.
    #
    # Este bloque tiene que ir ANTES del `/static/` de abajo por legibilidad — funcionalmente gana
    # igual, porque nginx elige el prefijo más largo.
    location /static/img/mugshots/ {
        alias /srv/dglweb-datos/mugshots/;
        # UNA sola `Cache-Control`, no `expires` + `add_header`. Las dos escriben esa cabecera, así
        # que juntas la mandan DUPLICADA — comprobado en producción. Los navegadores las combinan,
        # pero una respuesta con dos cabeceras de caché distintas es ambigua por definición.
        #
        # 30 días y no un año: estos archivos NO llevan hash. Se sobrescriben con el mismo nombre
        # cuando el dueño corre su script de descarga, así que una caché eterna dejaría al visitante
        # con el retrato viejo para siempre.
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ── EL RESTO DE LOS ESTÁTICOS ─────────────────────────────────────────────────────────────
    #
    # ESTE BLOQUE ES EL CAMBIO DE RENDIMIENTO MÁS GRANDE DEL SITIO, y sale de un número medido el
    # 2026-07-29: la portada referencia **210 recursos y 164 los servía gunicorn** a través de
    # WhiteNoise.
    #
    # Gunicorn corre con workers SÍNCRONOS —uno atiende una petición a la vez— así que una sola
    # visita eran 164 peticiones ocupando tres huecos. No es un problema de velocidad sino de
    # concurrencia: mientras un worker manda un SVG de 2 KB no está generando HTML para nadie.
    #
    # Los archivos los deja acá `deploy/estaticos.sh` después de cada despliegue. El comentario que
    # estuvo aquí decía que servirlos desde nginx «obligaría a acordarse de recolectarlos fuera del
    # build»: ya no, `Dockerfile.prod` corre `collectstatic` DURANTE la construcción.
    location /static/ {
        alias /srv/dglweb-datos/static/;

        # WhiteNoise deja los `.gz` y `.br` ya generados junto a cada archivo. Esto hace que nginx
        # los sirva tal cual en vez de comprimir en cada petición — el trabajo ya está hecho.
        gzip_static on;

        # Un año e inmutable, y se puede porque los nombres llevan un hash del contenido: un archivo
        # con el mismo nombre es literalmente el mismo archivo. Cambiarlo genera un nombre nuevo, así
        # que no hay forma de servir algo viejo por error.
        #
        # UNA sola directiva y no `expires` + `add_header`: las dos escriben `Cache-Control`, así que
        # juntas la mandaban DUPLICADA. Se vio en producción — `max-age=31536000` por un lado y
        # `public, immutable` por el otro.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;

        # Si un hash no está en disco, que el 404 lo dé nginx y no pase al contenedor: son peticiones
        # de navegadores con una versión anterior de la página en pantalla, y no tiene sentido gastar
        # un worker en contestarles.
        try_files $uri =404;
    }

    # Las imágenes que sube el editor por el CMS. NO están en la imagen de Docker —se suben en
    # caliente— así que WhiteNoise no las sirve: indexa sus archivos una vez al arrancar y una foto
    # de esta tarde no está en ese índice. Sin este bloque, el CMS acepta la imagen, el artículo se
    # publica y cada <img> devuelve 404.
    location /media/ {
        alias /srv/dglweb-datos/media/;
        # Un año: Wagtail nombra cada recorte con su hash, así que un archivo con el mismo nombre es
        # el mismo archivo. Cambiar la foto genera un nombre nuevo, no pisa el viejo.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        autoindex off;
    }

    location / {
        proxy_pass http://dglweb;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sin esto Django cree que la petición llegó por HTTP: arma mal los enlaces absolutos y
        # `SECURE_SSL_REDIRECT` entra en bucle.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El defecto de nginx es 1 MB y una foto de artículo lo pasa sin esfuerzo. El fallo sale como un
    # 413 seco en mitad del formulario de Wagtail, y NO deja rastro en los logs de Django.
    #
    # A nivel de `server`: se hereda a todos los `location`, así que no hay que repetirlo.
    client_max_body_size 25M;

    # NO se ponen cabeceras de seguridad acá, y no es un olvido: las manda Django, y más completas
    # de lo que estaría este archivo. Comprobado en producción — CSP entera, X-Frame-Options DENY,
    # HSTS, nosniff, Referrer-Policy y Cross-Origin-Opener-Policy. Duplicarlas acá crearía dos
    # fuentes de verdad que se separan, que es justo lo que pasó en `sabertables`.

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dominicanosengrandesligas.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dominicanosengrandesligas.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.dominicanosengrandesligas.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = dominicanosengrandesligas.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name dominicanosengrandesligas.com www.dominicanosengrandesligas.com;
    return 404; # managed by Certbot
}
