# Va en `/etc/nginx/conf.d/hardening.conf`.
#
#   sudo install -m 644 deploy/nginx-hardening.conf /etc/nginx/conf.d/hardening.conf
#
# Se aplica a TODOS los sitios del servidor —dglweb, Revive, pgAdmin, Portainer, sabertables,
# sixdegrees— porque `conf.d/` se carga dentro del contexto `http`. Cambiar algo acá los toca a todos.
#
#
# LOS TIEMPOS DE ESPERA SON LO QUE DE VERDAD PROTEGE
# ---------------------------------------------------
# Diez segundos para recibir cabeceras y cuerpo, y quince de keepalive. Contra un cliente que abre
# conexiones y las deja a medias —el ataque clásico de agotar los slots sin gastar ancho de banda—
# esto es la defensa, no los `limit_req`: aquel limita la FRECUENCIA de peticiones completas, y acá el
# problema es una petición que nunca termina.
#
# `client_max_body_size 5m` aplica también al CMS. Es lo que limita el tamaño de una imagen subida
# desde Wagtail: si el editor se queja de que una foto «no sube» y el navegador enseña un 413, es
# esto y no un fallo de la aplicación.
#
#
# LAS ZONAS DE `limit_req` ESTÁN REPARTIDAS EN TRES ARCHIVOS, y conviene saberlo
# -------------------------------------------------------------------------------
#   nginx.conf         search, general, portainer_rl, sixdegrees_search, sixdegrees_general,
#                      pgadmin_rl
#   hardening.conf     reqs  (la de acá abajo)
#   limites.conf       dgl_html, dgl_estaticos, dgl_salud   ← las de dglweb
#
# No es un problema en sí, pero explica un error que ya pasó: `nginx -t` falla con «zero size shared
# memory zone» cuando un `server` usa una zona que ningún archivo declara, y buscarla obliga a mirar
# en los tres sitios. Las de dglweb viven juntas en `nginx-limites.conf`, con el porqué de cada tasa.
limit_req_zone $binary_remote_addr zone=reqs:1m rate=5r/s;

# Quita el número de versión de nginx de las cabeceras y de las páginas de error. No detiene a nadie
# decidido —hay mil formas de deducir la versión— pero sí a los escáneres que buscan por versión
# exacta, que son la mayoría de los que se ven en el log.
server_tokens off;

client_max_body_size 5m;

client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          10s;
keepalive_timeout     15s;
