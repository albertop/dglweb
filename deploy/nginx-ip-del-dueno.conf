# La IP desde la que se administra el servidor. Va en `/etc/nginx/snippets/ip-del-dueno.conf`.
#
#   sudo install -D -m 644 deploy/nginx-ip-del-dueno.conf /etc/nginx/snippets/ip-del-dueno.conf
#
# ESTE ARCHIVO LO REESCRIBE UN CRON. El dueño tiene IP dinámica de casa, así que
# `/usr/local/bin/change_nginx_allow_ip.sh` la resuelve por DuckDNS y actualiza esta línea. Lo que
# haya escrito acá es solo el valor de arranque: no se edita a mano ni se confía en él.
#
#
# POR QUÉ UN ARCHIVO APARTE Y NO LA IP EN CADA SITIO
# ---------------------------------------------------
# Estuvo repetida en cuatro configuraciones —portainer, pgadmin, el CMS de dglweb y el panel de
# Revive— y el cron **solo actualizaba las dos primeras**. Las otras dos tenían la IP escrita a mano y
# nadie las tocaba: seguían funcionando por casualidad, y el siguiente cambio de IP habría dejado al
# dueño fuera del CMS y de Revive sin ninguna señal de por qué.
#
# Y AÑADIRLAS AL SCRIPT HABRÍA SIDO PEOR. Su `awk` inserta `allow`/`deny all` al nivel del `server`,
# porque portainer y pgadmin son sitios privados enteros. En dglweb la restricción vive DENTRO de un
# `location` —solo `/cms` y `/django-admin`—, así que el script no habría encontrado el `allow` donde
# lo busca, habría creído que falta, y lo habría insertado en la raíz del `server`: **el sitio público
# entero cerrado al mundo salvo una IP**, con `nginx -t` en verde porque la sintaxis es impecable.
#
# Con un `include` no hay nada que parsear. El cron reescribe una línea, y todo el que la incluya la
# hereda — incluidos los sitios que aún no existen.
#
#
# CÓMO SE USA, Y EL `deny all` NO VA ACÁ
# ---------------------------------------
#     location ~ ^/(cms|django-admin)(/|$) {
#         include /etc/nginx/snippets/ip-del-dueno.conf;
#         deny all;
#         …
#     }
#
# El `deny all` se queda en cada sitio a propósito: es la decisión de CERRAR ese bloque, y tiene que
# leerse ahí. Si viviera acá dentro, un `include` puesto por error en el sitio equivocado cerraría una
# ruta pública sin que se vea nada raro en el archivo que uno está leyendo.
#
# El orden importa y es el que está: en nginx las reglas de acceso se evalúan de arriba abajo y gana
# la primera que casa. Con `deny all` delante, el `allow` no llega a mirarse nunca.

allow 73.244.42.221;
