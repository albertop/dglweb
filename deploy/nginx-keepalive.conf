# Va en `/etc/nginx/conf.d/keepalive.conf`.
#
#   sudo install -m 644 deploy/nginx-keepalive.conf /etc/nginx/conf.d/keepalive.conf
#
# Traduce la cabecera `Connection` según lo que pida cada petición.
#
# Sin esto hay que elegir una de dos, y las dos son malas:
#
#   Connection ""          el keepalive funciona y los websockets se rompen
#   Connection "upgrade"   los websockets van y cada petición normal abre y cierra una conexión
#
# Con el mapa, cada petición recibe lo que le toca. Lo usan pgAdmin (su terminal de consultas) y
# Portainer (las consolas de contenedor).
#
# Va en `conf.d/`, que nginx carga dentro del contexto `http` — un `map` no puede vivir dentro de un
# `server`, y tenerlo en un archivo propio evita repetirlo en cada sitio.
map $http_upgrade $conexion_keepalive {
    default upgrade;   # petición de websocket: hay que dejar pasar el `upgrade`
    ''      '';        # petición normal: vacío, que es lo que habilita el keepalive
}
