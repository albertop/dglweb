# /etc/nginx/conf.d/limites.conf
#
# Límites de peticiones por IP. Va en `conf.d/`, que nginx incluye dentro del contexto `http`, porque
# `limit_req_zone` SOLO se puede declarar ahí: dentro de un `server` nginx ni siquiera arranca.
#
# Las zonas se declaran acá y se APLICAN en cada sitio con `limit_req`. Declarar una zona no limita
# nada por sí solo — es solo reservar la memoria donde se lleva la cuenta.
#
#
# POR QUÉ HACEN FALTA
# -------------------
# dglweb no tenía ninguno, al revés que pgAdmin, Portainer y sabertables. Con el lanzamiento eso es
# tanto un asunto de seguridad como de estabilidad: un rastreador agresivo o un script de alguien
# probando cosas puede tumbar el sitio sin mala intención ninguna.
#
#
# POR QUÉ LOS NÚMEROS SON TAN ALTOS, Y NO ES PEREZA
# --------------------------------------------------
# Medido el 2026-07-29: una visita a la portada pide **68 archivos distintos** además del HTML, y por
# HTTP/2 llegan casi todos a la vez por la misma conexión. Un límite pensado «para páginas» mataría a
# cualquiera que abra el sitio.
#
# Y hay una razón más gorda: **CGNAT**. En República Dominicana muchísimos usuarios móviles salen a
# internet compartiendo una misma IP pública. Un límite ajustado no bloquea a un atacante: bloquea a
# medio Claro. Por eso estos números no están puestos para «ser justos» con cada visitante, sino para
# parar UN SOLO cliente que se vuelve loco, dejando pasar de sobra a la gente normal.
#
# La cuenta: 20 páginas por segundo sostenidas es imposible para una persona —lee una cada varios
# segundos— pero es poco para un pico de gente detrás de la misma IP de operadora.
limit_req_zone $binary_remote_addr zone=dgl_html:10m rate=20r/s;

# Los estáticos son otra cosa: los sirve nginx desde disco, no cuestan casi nada, y una sola visita
# ya son 68. Este límite existe solo para cortar una descarga masiva del sitio entero, no para
# regular a nadie.
limit_req_zone $binary_remote_addr zone=dgl_estaticos:10m rate=300r/s;

# LAS RUTAS DE SALUD, con un límite aparte y MUCHO más estrecho (SEC-01 del review v12).
#
# No son páginas: las consulta un monitor una vez por minuto. Un visitante no las pide nunca.
#
# Y son las más caras de todo el sitio cuando algo va mal: `/health/proxy` y `/health/adserver` salen
# a la red con un tope de cinco segundos, así que con el upstream caído cada petición ocupa un hilo
# durante esos cinco segundos enteros. Dentro de la aplicación ya hay un cerrojo que deja sondear a
# uno solo; esto es la defensa de afuera, para que la ráfaga ni siquiera llegue a gunicorn.
#
# 2 por segundo con arranque de 5 deja pasar de sobra a cualquier monitor —incluso a varios— y corta
# en seco a quien intente usarlas como palanca.
limit_req_zone $binary_remote_addr zone=dgl_salud:5m rate=2r/s;

# 10m guarda unas 160.000 IPs. Cuando la zona se llena, nginx tira las más viejas — no falla.

# 429 y no el 503 de fábrica, y esto importa de verdad: **429 significa «vas muy rápido, vuelve»** y
# Googlebot lo entiende y baja el ritmo. Un 503 significa «el servidor está roto», y repetido hace
# que Google saque páginas del índice. Con el 503 por defecto, un pico de tráfico podría costar
# posiciones de búsqueda.
limit_req_status 429;

# Los rechazos al registro de errores como aviso, no como error: son normales y esperados, y no
# tienen que confundirse con un problema del servidor cuando alguien mire los logs.
limit_req_log_level warn;
