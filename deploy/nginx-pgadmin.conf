# /etc/nginx/sites-available/pgadmin.conf
#
# pgAdmin, la única forma de mirar la base sin entrar por SSH. Se versiona acá aunque no sea de
# dglweb: la base que administra es la que comparten el sitio y Revive.
#
#
# LA IP DE ESTE ARCHIVO LA REESCRIBE EL CRON, Y NO USA EL SNIPPET
# ----------------------------------------------------------------
# El resto de los sitios cerrados por IP —el CMS de dglweb y el panel de Revive— usan
# `include /etc/nginx/snippets/ip-del-dueno.conf`. Acá NO, y es a propósito: este archivo y el de
# Portainer los edita `change_nginx_allow_ip.sh` con un `awk` que busca la línea `allow` literal al
# nivel del `server`. Cambiarla por un `include` haría que no la encontrara, creyera que falta, y
# metiera una segunda.
#
# Así que la IP de abajo **está viva y desactualizada en cuanto el dueño cambie de proveedor** hasta
# que el cron corra. En el repositorio es solo el valor del momento en que se guardó.
#
# La consolidación —pasar estos dos al snippet y quitarle el `awk` al script— está pendiente y
# simplificaría el script a una tercera parte. No se hizo porque toca un cron que funciona.
#
#
# ESTE SÍ SE CIERRA ENTERO, al revés que `promo.`
# ------------------------------------------------
# Acá dentro no hay nada que un visitante deba ver, así que la lista blanca va a nivel de `server` y
# no por ruta. En Revive no se puede hacer eso: la entrega de anuncios la pide el navegador de cada
# lector y tiene que ser pública.
#
#
# OJO: NO INCLUYE `options-ssl-nginx.conf` DE CERTBOT
# -----------------------------------------------------
# Declara el certificado a mano y no trae `ssl_protocols`, así que hereda el del `http` global — que
# lista `TLSv1 TLSv1.1`. Si la política de OpenSSL de Ubuntu no lo bloquea, este panel acepta TLS 1.0.
# Ver la cabecera de `deploy/nginx.conf`: está sin resolver.

# El pool de conexiones hacia pgAdmin. Va FUERA de `server`, en el contexto `http`.
#
# `keepalive 8` y no 32: acá entra una persona, no el público. Guardar más conexiones ociosas de las
# que se van a usar es memoria en el contenedor sin ninguna ganancia.
upstream pgadmin {
    server 127.0.0.1:5050;
    keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name pgadmin.prdm0.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    allow all;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name pgadmin.prdm0.com;

  ssl_certificate     /etc/letsencrypt/live/pgadmin.prdm0.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pgadmin.prdm0.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;

  # `Referrer-Policy: no-referrer` NO va acá: pgAdmin valida el Referer en sus llamadas internas y
  # sin él devuelve 401 en todas — la pantalla queda en blanco tras un login que sí funcionó.
  #add_header Referrer-Policy "no-referrer" always;

  # Lock to your IP
  allow 73.244.42.221;
  deny all;

  # pgAdmin importa y exporta archivos; el defecto de 1 MB corta un restore a la mitad.
  client_max_body_size 100M;

  location / {
    limit_req zone=pgadmin_rl burst=20 nodelay;

    proxy_pass http://pgadmin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # La terminal de consultas de pgAdmin va por websocket, así que el `Upgrade` tiene que pasar.
    #
    # Y `Connection` sale del mapa de `conf.d/keepalive.conf` en vez de ir fijo a "upgrade": así una
    # consulta normal reutiliza la conexión y una de websocket sigue negociando su upgrade. Con el
    # valor fijo, el `keepalive` del `upstream` de arriba no serviría de nada.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexion_keepalive;

    # Una consulta pesada tarda más que los 60s por defecto, y el 504 llega sin decir de quién es.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
