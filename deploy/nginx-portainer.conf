# /etc/nginx/sites-available/portainer.conf
#
# Portainer, desde donde se despliegan los tres stacks del VPS. Se versiona aunque no sea de dglweb:
# es la puerta por la que pasa cada despliegue del sitio.
#
#
# LA IP LA REESCRIBE EL CRON, Y ESTE TAMPOCO USA EL SNIPPET
# ----------------------------------------------------------
# Igual que `pgadmin.conf`: el `awk` de `change_nginx_allow_ip.sh` busca la línea `allow` literal al
# nivel del `server`, así que cambiarla por un `include` haría que no la encontrara e insertara una
# segunda. La IP escrita abajo es solo el valor del momento en que se guardó este archivo.
#
#
# LE FALTAN LAS CABECERAS DE WEBSOCKET — LA CONSOLA DE CONTENEDOR NO PUEDE FUNCIONAR
# -----------------------------------------------------------------------------------
# `conf.d/keepalive.conf` declara el mapa `$conexion_keepalive` y su comentario dice que **lo usan
# pgAdmin y Portainer**. pgAdmin sí lo usa; **este archivo no lo menciona**. No hay
# `proxy_set_header Upgrade` ni `Connection` por ningún lado.
#
# Sin esas dos cabeceras nginx no deja pasar la negociación de `Upgrade`, así que todo lo de Portainer
# que va por websocket se queda colgado: la **consola de un contenedor** (`exec`/`attach`) y el
# seguimiento de logs en vivo. El resto de la interfaz —que es HTTP normal— funciona perfectamente,
# por eso puede llevar así mucho tiempo sin que nadie lo note.
#
# CÓMO SE COMPRUEBA: entrar a un contenedor desde Portainer → Containers → Console → Connect. Si se
# queda intentando conectar, es esto. El arreglo son dos líneas dentro del `location /`:
#
#     proxy_set_header Upgrade $http_upgrade;
#     proxy_set_header Connection $conexion_keepalive;
#
# No se aplicó acá porque no está confirmado que la consola se use ni que esté rota — y este archivo
# se guarda tal como corre en el servidor. Si se arregla, hay que cambiarlo en los dos sitios.
#
#
# Y NO TIENE `upstream` NI `keepalive`, al revés que pgAdmin: proxea directo a `127.0.0.1:9000`, así
# que cada petición abre y cierra su conexión. Para un panel que usa una persona no se nota; se anota
# por si algún día se compara con `pgadmin.conf` y la diferencia parece intencional.
server {
  listen 80;
  listen [::]:80;
  server_name docker.prdm0.com;

  # Let's Encrypt HTTP-01 challenge (must stay public)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    allow all;
    default_type "text/plain";
    try_files $uri =404;
  }

  # Everything else redirects to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name docker.prdm0.com;

  # No incluye `options-ssl-nginx.conf` de Certbot, así que hereda el `ssl_protocols` del `http`
  # global — que desde el 2026-07-30 empieza en TLS 1.2. Ver `deploy/nginx.conf`.
  ssl_certificate     /etc/letsencrypt/live/docker.prdm0.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/docker.prdm0.com/privkey.pem;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  # `no-referrer` SÍ se puede acá, al contrario que en pgAdmin y Revive: Portainer no valida el
  # `Referer` en sus llamadas internas.
  add_header Referrer-Policy "no-referrer" always;

  # Lock to your IP
  allow 73.244.42.221;
  deny all;

  location / {
    # Rate limit (still useful even with allow-list)
    limit_req zone=portainer_rl burst=20 nodelay;

    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
