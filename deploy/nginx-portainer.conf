# /etc/nginx/sites-available/portainer.conf
#
# Portainer, desde donde se despliegan los tres stacks del VPS. Se versiona aunque no sea de dglweb:
# es la puerta por la que pasa cada despliegue del sitio.
#
#
# LA IP LA REESCRIBE EL CRON, Y ESTE TAMPOCO USA EL SNIPPET
# ----------------------------------------------------------
# Igual que `pgadmin.conf`: el `awk` de `change_nginx_allow_ip.sh` busca la línea `allow` literal al
# nivel del `server`, así que cambiarla por un `include` haría que no la encontrara e insertara una
# segunda. La IP escrita abajo es solo el valor del momento en que se guardó este archivo.
#
#
# LAS CABECERAS DE WEBSOCKET FALTABAN — AÑADIDAS EL 2026-07-30
# --------------------------------------------------------------
# `conf.d/keepalive.conf` declara el mapa `$conexion_keepalive` y su comentario decía que **lo usan
# pgAdmin y Portainer**. pgAdmin sí lo usaba; este archivo **no lo mencionaba**: no tenía
# `proxy_set_header Upgrade` ni `Connection` por ningún lado.
#
# Sin esas dos cabeceras nginx no deja pasar la negociación de `Upgrade`, así que todo lo de Portainer
# que va por websocket se quedaba colgado: la **consola de un contenedor** (`exec`/`attach`) y el
# seguimiento de logs en vivo. El resto de la interfaz es HTTP normal y funcionaba perfectamente — por
# eso pudo estar así mucho tiempo sin que nadie lo notara.
#
# Lo delató un COMENTARIO QUE NO CUADRABA CON EL CÓDIGO, no un error: `keepalive.conf` nombraba a
# Portainer como usuario del mapa y Portainer no lo usaba. Vale la pena recordarlo — la mitad de lo
# que se encontró este día salió de contradicciones así, no de algo que fallara ruidosamente.
#
# `$conexion_keepalive` y no `"upgrade"` fijo: con el valor fijo, cada petición normal abriría y
# cerraría su conexión. El mapa da `upgrade` solo cuando el cliente lo pide y vacío el resto del
# tiempo, que es lo que habilita el keepalive.
#
#
# NO TIENE `upstream` NI `keepalive`, al revés que pgAdmin: proxea directo a `127.0.0.1:9000`, así que
# cada petición abre y cierra su conexión — el `Connection` vacío del mapa no llega a aprovecharse.
# Para un panel que usa una persona no se nota; se anota para que la diferencia entre los dos archivos
# no parezca intencional el día que alguien los compare.
server {
  listen 80;
  listen [::]:80;
  server_name docker.prdm0.com;

  # Let's Encrypt HTTP-01 challenge (must stay public)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    allow all;
    default_type "text/plain";
    try_files $uri =404;
  }

  # Everything else redirects to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name docker.prdm0.com;

  # No incluye `options-ssl-nginx.conf` de Certbot, así que hereda el `ssl_protocols` del `http`
  # global — que desde el 2026-07-30 empieza en TLS 1.2. Ver `deploy/nginx.conf`.
  ssl_certificate     /etc/letsencrypt/live/docker.prdm0.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/docker.prdm0.com/privkey.pem;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  # `no-referrer` SÍ se puede acá, al contrario que en pgAdmin y Revive: Portainer no valida el
  # `Referer` en sus llamadas internas.
  add_header Referrer-Policy "no-referrer" always;

  # Lock to your IP
  allow 73.244.42.221;
  deny all;

  location / {
    # Rate limit (still useful even with allow-list)
    limit_req zone=portainer_rl burst=20 nodelay;

    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # La consola de contenedor y los logs en vivo van por websocket. `Connection` sale del mapa de
    # `conf.d/keepalive.conf` — ver la cabecera de este archivo.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexion_keepalive;

    # Una sesión de consola se queda abierta sin tráfico mientras nadie escribe. Con los 60s por
    # defecto, nginx la corta al minuto y la consola «se cae sola» sin decir por qué.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
