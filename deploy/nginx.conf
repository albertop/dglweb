# El `/etc/nginx/nginx.conf` del VPS, tal cual corre.
#
# Se versiona por dos líneas que otras cosas dan por sentadas:
#
#   access_log /var/log/nginx/access.log;
#       Ningún vhost declara log propio, así que TODOS escriben acá. Es lo que hace que las cuatro
#       jails de fail2ban cubran los tres sitios con un solo archivo. Ver `docs/CORTAFUEGOS.md`.
#
#   include /etc/nginx/conf.d/*.conf;
#       El orden importa: `conf.d/` se carga ANTES que `sites-enabled/`, y por eso las zonas de
#       `limit_req` pueden declararse allí y usarse en los `server` de acá abajo.
#
# CUIDADO AL TOCARLO: es un archivo de la distribución. Un `apt upgrade` de nginx puede querer
# reemplazarlo, y ahí hay que decir que no o volver a aplicar estos cambios.
#
#
# TLSv1 Y TLSv1.1 SE QUITARON EL 2026-07-30
# ------------------------------------------
# RFC 8996 los retiró y los navegadores dejaron de hablarlos en 2020. La línea decía
# `ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;` y ahora empieza en 1.2.
#
# SE QUITARON SIN LLEGAR A MEDIR SI EL SERVIDOR LOS ACEPTABA, y esa es la lección. Dos intentos de
# comprobarlo fallaron POR EL LADO DEL CLIENTE y los dos parecían decir que no:
#
#   curl en Windows        SEC_E_UNSUPPORTED_FUNCTION — Schannel no ofrece TLS 1.0
#   openssl en el VPS      no protocols available — OpenSSL 3 exige @SECLEVEL=0 para ofrecerlo
#
# El primero llegué a escribirlo acá como «comprobado, salen rechazados». Era falso: se midió el
# cliente, no el servidor.
#
# Y la medición no hacía falta. Quitarlos es correcto en los dos escenarios posibles — si se aceptaban
# se cierra un agujero, y si no, no cambia nada. Ningún cliente de 2026 los necesita. Estaba tratando
# como una decisión que pedía datos una que no los pedía.
#
# LO QUE SÍ IMPORTABA, y era el motivo real de mirar: `pgadmin.conf` no incluye
# `options-ssl-nginx.conf` de Certbot ni declara `ssl_protocols` propio, así que heredaba esta línea
# tal cual. Y `/etc/ssl/openssl.cnf` NO trae `system_default_sect`, o sea que Ubuntu tampoco estaba
# forzando un mínimo. dglweb y `promo.` sí estaban cubiertos por el include de Certbot; pgAdmin no.
#
#
# EL `gzip` DE ACÁ NO COMPRIME EL CSS NI EL JS, Y ESTÁ BIEN
# ----------------------------------------------------------
# `gzip on;` con todos los `gzip_types` comentados solo comprime `text/html`, que es el defecto de
# nginx. Parece un olvido caro después de mover los estáticos a nginx, y no lo es: el `server` de
# dglweb lleva `gzip_static on;`, que sirve los `.gz` que WhiteNoise generó al construir la imagen.
#
# Medido el 2026-07-30 sobre el CSS de producción: 88.026 bytes sin comprimir, **28.501 servidos**
# con `Content-Encoding: gzip`. Un 68% menos, y sin gastar CPU en cada petición.
#
# Lo que SÍ queda sin comprimir es lo que no es HTML y no está pre-comprimido: el `sitemap.xml` y las
# respuestas JSON de las rutas de salud. Poca cosa, y ninguna en la ruta caliente.
user www-data;
worker_processes auto;
worker_rlimit_nofile 8192;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 2048;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##


        # Rate limiting zones
        limit_req_zone $binary_remote_addr zone=search:10m rate=10r/m;
        limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
        limit_req_zone $binary_remote_addr zone=portainer_rl:10m rate=5r/s;
        limit_req_zone $binary_remote_addr zone=sixdegrees_search:10m rate=20r/m;
        limit_req_zone $binary_remote_addr zone=sixdegrees_general:10m rate=100r/m;
        limit_req_zone $binary_remote_addr zone=pgadmin_rl:10m rate=10r/s;


	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


