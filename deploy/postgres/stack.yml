# El stack de Postgres y pgAdmin, para Portainer (Stacks → postgres → Editor).
#
# NO ES «LA BASE DE dglweb». Es la instancia que comparten **dglweb y Revive**, cada uno con su base y
# su rol. Eso importa para dos cosas:
#
#   * Un respaldo que solo cubra `dglweb` deja fuera las campañas y las estadísticas del anunciante.
#   * Reiniciar este stack tumba el sitio Y la publicidad a la vez.
#
# Vive en el repositorio por lo mismo que los otros dos: un stack que solo existe dentro de Portainer
# no se puede revisar, ni comparar, ni recuperar si alguien lo edita mal.
#
#
# LO QUE ESTE ARCHIVO NO TRAE Y HACE FALTA PARA LEVANTARLO
# ---------------------------------------------------------
# `/srv/postgres/init/` — los scripts que Postgres corre **una sola vez**, cuando el volumen está
# vacío. Ahí se crean la base `dglweb`, su rol propio y la extensión `unaccent`, que es lo que hace que
# «nunez» encuentre a Núñez en el buscador. La aplicación se conecta con un rol restringido que NO
# puede instalar extensiones, así que si esos scripts no están, `migrate` falla al llegar a
# `players/0005_unaccent.py`.
#
# Y solo corren con el volumen vacío: en una base ya creada no se ejecutan, así que no se puede
# «arreglar» un olvido reiniciando el stack.
#
#
# DETALLES QUE PARECEN ARBITRARIOS Y NO LO SON
# ----------------------------------------------
# `shm_size: 256mb` — Docker da 64 MB de `/dev/shm` por defecto y Postgres los usa para ordenaciones
# y consultas en paralelo. Con el valor de fábrica aparecen errores de memoria compartida en consultas
# grandes, y el mensaje no menciona Docker por ningún lado.
#
# `POSTGRES_DB: postgres` — a propósito: es la base de mantenimiento. Las de verdad las crean los
# scripts de `init/`, porque son dos aplicaciones y no una.
#
# Las cuatro `PGADMIN_CONFIG_PROXY_X_*_COUNT: 1` y `ENHANCED_COOKIE_PROTECTION: "False"` son porque
# pgAdmin va detrás de nginx. Sin ellas, redirige a `localhost` después de entrar y rechaza la sesión
# por no reconocer el origen.
#
#
# OJO CON LA ZONA HORARIA, que no coincide con la del sitio
# ----------------------------------------------------------
# Acá dice `America/New_York` y el sitio corre en `America/Santo_Domingo`. **No son la misma**: Nueva
# York cambia de hora y la República Dominicana no, así que unos cuatro meses al año van desfasadas
# una hora.
#
# Hoy no rompe nada porque Django guarda en UTC (`USE_TZ = True`) y las jornadas se calculan en
# Python. Afectaría el día que algo agrupe por fecha **del lado del servidor** —un `now()::date` en
# SQL, o los sellos de tiempo del propio log de Postgres al depurar—. Queda anotado, no arreglado:
# cambiarlo reinicia la base, y no hay motivo suficiente hoy.
services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta}
      DGLWEB_DB_PASSWORD: ${DGLWEB_DB_PASSWORD:?falta}
      TZ: America/New_York
    volumes:
      # UN SOLO MONTAJE en `/var/lib/postgresql`, no en `…/data`. Postgres 18+ guarda los datos en un
      # subdirectorio con el número de versión, y montar así es lo que permite un `pg_upgrade --link`
      # en el sitio el día que toque subir de major.
      - postgres_data:/var/lib/postgresql
      - /srv/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [backend]

  pgadmin:
    image: dpage/pgadmin4:9.16
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: aperdomo@gmail.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?falta}
      TZ: America/New_York
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: 1
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # Al loopback, como todo acá. pgAdmin entra por nginx, que además lo cierra a la IP del dueño con
    # el snippet — ver `docs/CORTAFUEGOS.md`.
    ports:
      - "127.0.0.1:5050:80"
    depends_on: [postgres]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [backend]

networks:
  backend:
    # Externa: la comparten el sitio, Revive y el proxy. Sin esta línea, compose crearía una red nueva
    # llamada `postgres_backend` y ninguno de ellos vería la base.
    external: true

volumes:
  postgres_data:
  pgadmin_data:
