# Reinicia el scheduler cada vez que arranca el demonio de Docker.
#
#   /etc/systemd/system/docker.service.d/reiniciar-scheduler.conf
#
# POR QUÉ EXISTE ESTE ARCHIVO
# ═══════════════════════════
#
# El 2026-08-01 el pipeline estuvo DOCE HORAS Y MEDIA sin correr un solo job, y no hubo forma de
# notarlo mirando los contenedores: todos estaban levantados y el scheduler disparaba sus siete jobs
# puntualmente cada hora.
#
# Lo que pasó, con las horas medidas:
#
#     04:20:00 UTC   último job bueno (build_mlb_leaders)
#     04:22:18 UTC   arranca el demonio de Docker   <-- la causa
#     desde ahí      todos los jobs fallan en 3 ms:
#                    "error creating exec: cannot connect to Docker endpoint"
#
# El servidor NO se reinició — llevaba dos días arriba. Solo se reinició `docker.service`, y eso basta:
# al arrancar recrea `/var/run/docker.sock`, y el montaje del scheduler se queda apuntando al inodo
# viejo, que ya no acepta conexiones. El contenedor sigue vivo con un socket muerto en la mano.
#
# POR QUÉ `restart: unless-stopped` NO SIRVE ACÁ
# ----------------------------------------------
# Porque el contenedor no se cae. Sigue en pie, registra sus jobs, los dispara a su hora y falla al
# instante. La política de reinicio solo actúa sobre un proceso que muere, y este no muere: se vuelve
# inútil. Es un modo de fallo peor que caerse, porque `docker ps` lo enseña sano.
#
# Y POR QUÉ NO SE VIO EN EL LOG DE INGESTA
# ----------------------------------------
# `IngestRun` existe justo para que un fallo silencioso se vuelva una fila roja en el Backoffice, pero
# **no puede registrar un job que nunca llegó a arrancar**. Durante doce horas el log se vio limpio
# porque no había nada que registrar. Es exactamente el mismo agujero que el incidente del 2026-07-26,
# por otro camino.
#
# Lo que sí funcionó fue el semáforo: `/health/pipeline` no pregunta «¿falló algo?» sino «¿corrió
# algo?», y a las tres horas se puso en rojo. Esa es la diferencia entre vigilar corridas y vigilar
# errores, y es la razón por la que ese endpoint está escrito así.
#
# LOS QUINCE SEGUNDOS
# -------------------
# `ExecStartPost` corre en cuanto el demonio está listo, y en ese instante los contenedores con
# `restart: unless-stopped` todavía están volviendo. Reiniciar el scheduler antes de que exista no
# haría nada. Quince segundos es holgado para este servidor y no retrasa nada que importe: systemd no
# espera a `ExecStartPost` para dar el servicio por arrancado.
#
# EL `|| true`
# ------------
# Un fallo acá no puede impedir que Docker arranque. Si el contenedor no existe todavía —servidor
# recién montado, stack sin desplegar— esto tiene que ser un no-op y no un servicio en rojo.
#
# SON DOS CONTENEDORES, NO UNO — y eso se aprendió doce horas después (2026-08-01)
# ---------------------------------------------------------------------------------
# El arreglo se escribió pensando solo en el scheduler, porque fue el que se notó. Por la tarde, al
# intentar actualizar el stack, Portainer contestó:
#
#     Dial unix /var/run/docker.sock: connect: connection refused
#
# El mismo fallo, la misma causa y desde la misma hora: **el reinicio del demonio deja inservible a
# TODO contenedor que tenga el socket montado**, no solo al que se notó primero. En este servidor son
# dos, y el segundo estuvo roto medio día sin que nadie lo mirara porque a Portainer solo se entra
# cuando hace falta.
#
# Si algún día se monta un tercero con el socket —un `watchtower`, un agente de métricas— tiene que
# entrar en esta lista. Es lo que `make checkstacks` no puede comprobar por sí solo: sabe atar el
# nombre del scheduler a `deploy/stack.yml`, pero Portainer no vive en ningún stack nuestro.
#
# CÓMO INSTALARLO
# ---------------
#     sudo mkdir -p /etc/systemd/system/docker.service.d
#     sudo cp deploy/systemd/reiniciar-con-docker.conf \
#             /etc/systemd/system/docker.service.d/reiniciar-con-docker.conf
#     sudo systemctl daemon-reload
#
# No hace falta reiniciar Docker para instalarlo. Para comprobarlo, en cambio, sí:
#
#     sudo systemctl restart docker
#     sleep 25 && docker logs --since 1m dglweb-scheduler | grep "New job registered"
#
# Si salen los siete jobs registrándose de nuevo, funciona. Y para el segundo, entrar a Portainer:
# si la lista de contenedores carga, su socket también quedó bueno.

[Service]
ExecStartPost=/bin/sh -c 'sleep 15; /usr/bin/docker restart dglweb-scheduler || true'
ExecStartPost=/bin/sh -c '/usr/bin/docker restart portainer || true'
