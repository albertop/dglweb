# Local dev stack for dglweb: Django+Wagtail (web) + PostgreSQL (db).
services:
  db:
    # Must match the data server (10.0.0.39) and CI: same major everywhere, so tests run on
    # what production runs on and pg_dump/pg_restore work across environments.
    #
    # NOT -alpine: musl reports en_US.utf8 but collates byte-wise, so "Félix" sorts after
    # "Freddy" and "Peña" after "Pérez" — wrong for Spanish names, and visible to readers in
    # every sorted list. The Debian image uses glibc, like the server. Verified by comparing
    # md5(string_agg(full_name ORDER BY full_name)) against 10.0.0.39.
    image: postgres:18
    environment:
      POSTGRES_DB: dglweb
      POSTGRES_USER: dglweb
      POSTGRES_PASSWORD: dglweb
    volumes:
      # Postgres 18+ wants a single mount at /var/lib/postgresql (data goes in a versioned
      # subdirectory), which is what makes an in-place `pg_upgrade --link` possible later.
      - dglweb_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dglweb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://dglweb:dglweb@db:5432/dglweb
      # The proxy runs on the dev server. The key is a secret: it comes from .env (gitignored),
      # never from this file.
      MLB_PROXY_URL: ${MLB_PROXY_URL:-http://10.0.0.39:3002}
      MLB_PROXY_API_KEY: ${MLB_PROXY_API_KEY:-}
    volumes:
      # Los CSV de datos de apoyo: en el VPS se dejan acá y se suben desde el Backoffice.
      - dglweb_uploads:/app/uploads
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # The scraper schedule lives here as labels; the `scheduler` service reads them and runs the
    # command inside this container (job-exec), so it inherits the DB and proxy env. Only the
    # current season is refreshed daily; the historical backfill stays a manual import_batting.
    #
    # OJO: el horario NO es la única puerta. Todos estos jobs salvo `prune_ingest_log` consultan
    # `seasons_dates` al despertar y no hacen nada fuera de temporada — ver `stats/season_window.py`.
    # O sea que la ventana de trabajo la manda el DATO y se corrige en el Backoffice (Calendario de
    # temporadas), sin tocar este archivo ni desplegar. Un salto queda como fila `skipped` en el log
    # de ingesta, con el motivo; `prune_ingest_log` queda fuera de la puerta a propósito, porque
    # podar el log es mantenimiento y no pelota, y tiene que correr los doce meses.
    #
    # Los horarios siguen encadenando por reloj y no por dependencia: cada job arranca cuando
    # calcula que el anterior ya terminó. Es lo que dice QA-03 en el TODO y sigue abierto.
    #
    # Los tres jobs `*_post` corren toda la temporada aunque la postemporada sea octubre: hoy la
    # puerta es la ventana COMPLETA, así que de marzo a septiembre salen a buscar y no encuentran
    # nada. Afinarlo con `post_season_start_date` —que ya está en la misma tabla— está pendiente.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.batting-daily.schedule: "0 0 6 * * *"  # 6am, TZ below; solo si hay temporada abierta
      ofelia.job-exec.batting-daily.command: "python manage.py update_batting"
      ofelia.job-exec.pitching-daily.schedule: "0 15 6 * * *"  # 6:15am, tras bateo
      ofelia.job-exec.pitching-daily.command: "python manage.py update_pitching"
      ofelia.job-exec.fielding-daily.schedule: "0 30 6 * * *"  # 6:30am, tras pitcheo
      ofelia.job-exec.fielding-daily.command: "python manage.py update_fielding"
      ofelia.job-exec.batting-post-daily.schedule: "0 45 6 * * *"  # 6:45am; sin datos hasta que empiece octubre
      ofelia.job-exec.batting-post-daily.command: "python manage.py update_batting_post"
      ofelia.job-exec.pitching-post-daily.schedule: "0 0 7 * * *"  # 7:00am; ídem
      ofelia.job-exec.pitching-post-daily.command: "python manage.py update_pitching_post"
      ofelia.job-exec.fielding-post-daily.schedule: "0 15 7 * * *"  # 7:15am; ídem
      ofelia.job-exec.fielding-post-daily.command: "python manage.py update_fielding_post"
      ofelia.job-exec.build-career-totals-daily.schedule: "0 20 7 * * *"  # 7:20am; tras refrescar todas las stats
      ofelia.job-exec.build-career-totals-daily.command: "python manage.py build_career_totals"
      ofelia.job-exec.build-leaders-daily.schedule: "0 30 7 * * *"  # 7:30am; tras los totales de carrera, que lee
      ofelia.job-exec.build-leaders-daily.command: "python manage.py build_leaders"
      ofelia.job-exec.prune-log-daily.schedule: "0 45 7 * * *"  # 7:45am; poda el log, va último — SIN puerta de temporada
      ofelia.job-exec.prune-log-daily.command: "python manage.py prune_ingest_log"
      ofelia.job-exec.parity-career-weekly.schedule: "0 0 8 * * 0"  # domingos 8am; verifica carrera contra el proxy
      ofelia.job-exec.parity-career-weekly.command: "python manage.py parity_career"

  # Ofelia: a lean, Docker-native cron. It reads the labels above via the Docker socket and
  # execs the command on schedule — same image, separate lifecycle, no cron files.
  # If the daily refresh ever grows heavy, switch to job-run (an ephemeral container) for full
  # isolation; documented in docs/BUILD_PLAN.md.
  scheduler:
    image: mcuadros/ofelia:latest
    depends_on:
      - web
    command: daemon --docker
    environment:
      TZ: America/Santo_Domingo  # so "6am" is Dominican time, not UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  dglweb_uploads:
  dglweb_pgdata:
