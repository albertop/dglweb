# Local dev stack for dglweb: Django+Wagtail (web) + PostgreSQL (db).
services:
  db:
    # Must match the data server (10.0.0.39) and CI: same major everywhere, so tests run on
    # what production runs on and pg_dump/pg_restore work across environments.
    #
    # NOT -alpine: musl reports en_US.utf8 but collates byte-wise, so "Félix" sorts after
    # "Freddy" and "Peña" after "Pérez" — wrong for Spanish names, and visible to readers in
    # every sorted list. The Debian image uses glibc, like the server. Verified by comparing
    # md5(string_agg(full_name ORDER BY full_name)) against 10.0.0.39.
    image: postgres:18
    environment:
      POSTGRES_DB: dglweb
      POSTGRES_USER: dglweb
      POSTGRES_PASSWORD: dglweb
    volumes:
      # Postgres 18+ wants a single mount at /var/lib/postgresql (data goes in a versioned
      # subdirectory), which is what makes an in-place `pg_upgrade --link` possible later.
      - dglweb_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dglweb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://dglweb:dglweb@db:5432/dglweb
      # The proxy runs on the dev server. The key is a secret: it comes from .env (gitignored),
      # never from this file.
      MLB_PROXY_URL: ${MLB_PROXY_URL:-http://10.0.0.39:3002}
      MLB_PROXY_API_KEY: ${MLB_PROXY_API_KEY:-}
    volumes:
      # Los CSV de datos de apoyo: en el VPS se dejan acá y se suben desde el Backoffice.
      - dglweb_uploads:/app/uploads
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # El calendario NO vive acá. Estuvo como `labels` de este servicio y se rompió: `docker compose
    # run` clona las etiquetas del servicio, así que cada comando suelto creaba un contenedor efímero
    # con `ofelia.enabled=true`, Ofelia se re-apuntaba a él y al morir el contenedor todos los jobs
    # fallaban para siempre. Ahora está en `ofelia/config.ini`, apuntando por nombre de contenedor.
    container_name: dglweb-web-live  # el nombre al que apunta el scheduler; que sea fijo es el punto

  # Ofelia: un cron liviano y nativo de Docker. Lee su calendario de `ofelia/config.ini` y hace
  # `exec` dentro del contenedor web, así que hereda su entorno de DB y de proxy.
  #
  # `--config` y no `--docker`: el descubrimiento por etiquetas elegía cualquier contenedor que las
  # tuviera, y `docker compose run` las clona. Apuntar por nombre es lo que impide que un contenedor
  # efímero le robe el objetivo — ver la cabecera de `ofelia/config.ini`.
  #
  # La imagen va pinneada por digest. Con `latest`, un cambio no revisado entra en el próximo `pull`
  # y este servicio tiene el socket de Docker montado: es el contenedor donde menos se quiere una
  # actualización sorpresa (SEC-01 del review v6).
  scheduler:
    image: mcuadros/ofelia@sha256:efcbe2c5cf658a25de6443c1462d653f9cc03791d642e01fc6c638a00f97e492
    depends_on:
      - web
    command: daemon --config=/etc/ofelia/config.ini
    environment:
      TZ: America/Santo_Domingo  # para que "6am" sea hora dominicana y no UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia/config.ini:/etc/ofelia/config.ini:ro
    restart: unless-stopped

volumes:
  dglweb_uploads:
  dglweb_pgdata:
