; ═══════════════════════════════════════════════════════════════════════════════════════════════
; El calendario del scheduler (Ofelia).
;
; POR QUÉ ESTÁ ACÁ Y NO EN ETIQUETAS DE `docker-compose.yml`
; ----------------------------------------------------------
; Antes los jobs vivían como `labels` del servicio `web` y Ofelia los descubría por el socket de
; Docker. Eso se rompió en producción y estuvo roto días sin que nada avisara.
;
; El motivo: `docker compose run` CLONA las etiquetas del servicio. Cada vez que alguien corría un
; comando suelto —`docker compose run --rm web python manage.py …`— nacía un contenedor efímero con
; `ofelia.enabled=true`, Ofelia se re-apuntaba a él, el contenedor moría con `--rm`, y a partir de ahí
; TODOS los jobs fallaban para siempre con «No such container». Medido el 2026-07-26: 27 corridas
; fallidas contra 1 exitosa.
;
; Y el fallo era invisible: `IngestRun` existe para que un fallo silencioso se vuelva una fila roja en
; el Backoffice, pero no puede registrar un job que nunca llegó a arrancar. El log de ingesta se veía
; limpio porque no había nada que registrar.
;
; Apuntando por NOMBRE de contenedor, ningún efímero puede robarle el objetivo.
;
; EL ORDEN ES POR RELOJ, NO POR DEPENDENCIA
; -----------------------------------------
; Cada horario apuesta a que el anterior terminó. Nadie verifica el `IngestRun` del paso previo, así
; que `build_leaders` corre a las 7:30 aunque el refresco de fildeo haya fallado a las 6:30. Es
; QA-01+ARCH-01 en `docs/TODO.md`, aceptado como P2: el rebuild es completo y no incremental, así que
; un día con datos mezclados se cura solo a la mañana siguiente.
;
; LA OTRA PUERTA
; --------------
; El horario no decide solo. Todos estos comandos salvo `prune_ingest_log` consultan `seasons_dates`
; al despertar y no hacen nada fuera de temporada (ver `dglweb/stats/season_window.py`), dejando una
; fila `skipped` con el motivo. Los tres `*_post` usan además la ventana corta de octubre.
; ═══════════════════════════════════════════════════════════════════════════════════════════════

[global]
; A dónde va el registro de las corridas del propio scheduler.
save-folder = /tmp

; ── Refresco diario de la temporada en curso ────────────────────────────────────────────────────
; El backfill histórico NO está acá: es un `import_batting --from --to` manual y deliberado.

[job-exec "batting-daily"]
schedule = 0 0 6 * * *
container = dglweb-web-live
command = python manage.py update_batting

[job-exec "pitching-daily"]
schedule = 0 15 6 * * *
container = dglweb-web-live
command = python manage.py update_pitching

[job-exec "fielding-daily"]
schedule = 0 30 6 * * *
container = dglweb-web-live
command = python manage.py update_fielding

; ── Postemporada ────────────────────────────────────────────────────────────────────────────────
; Corren solo desde `post_season_start_date`, así que de marzo a septiembre se saltan solos.

[job-exec "batting-post-daily"]
schedule = 0 45 6 * * *
container = dglweb-web-live
command = python manage.py update_batting_post

[job-exec "pitching-post-daily"]
schedule = 0 0 7 * * *
container = dglweb-web-live
command = python manage.py update_pitching_post

[job-exec "fielding-post-daily"]
schedule = 0 15 7 * * *
container = dglweb-web-live
command = python manage.py update_fielding_post

; ── Lo derivado, después de que llegó todo el dato del día ───────────────────────────────────────
; Los liderazgos de por vida leen los totales de carrera, de ahí el orden.

[job-exec "build-career-totals-daily"]
schedule = 0 20 7 * * *
container = dglweb-web-live
command = python manage.py build_career_totals

[job-exec "build-leaders-daily"]
schedule = 0 30 7 * * *
container = dglweb-web-live
command = python manage.py build_leaders

; ── Avisos y mantenimiento ──────────────────────────────────────────────────────────────────────

; Lee lo que el refresco acaba de traer: quién de `dom_players` ya tiene números. No escribe nada.
[job-exec "detect-debuts-daily"]
schedule = 0 35 7 * * *
container = dglweb-web-live
command = python manage.py detect_debuts

; SIN puerta de temporada, a propósito: podar el log es mantenimiento y no pelota, y tiene que correr
; los doce meses — justo en invierno es cuando más filas `skipped` se escriben.
[job-exec "prune-log-daily"]
schedule = 0 45 7 * * *
container = dglweb-web-live
command = python manage.py prune_ingest_log

; Verifica los totales de carrera contra el proxy. Semanal porque es caro y no cambia a diario.
[job-exec "parity-career-weekly"]
schedule = 0 0 8 * * 0
container = dglweb-web-live
command = python manage.py parity_career
