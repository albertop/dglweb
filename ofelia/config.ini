; ═══════════════════════════════════════════════════════════════════════════════════════════════
; El calendario del scheduler (Ofelia).
;
; POR QUÉ ESTÁ ACÁ Y NO EN ETIQUETAS DE `docker-compose.yml`
; ----------------------------------------------------------
; Antes los jobs vivían como `labels` del servicio `web` y Ofelia los descubría por el socket de
; Docker. Eso se rompió en producción y estuvo roto días sin que nada avisara.
;
; El motivo: `docker compose run` CLONA las etiquetas del servicio. Cada vez que alguien corría un
; comando suelto —`docker compose run --rm web python manage.py …`— nacía un contenedor efímero con
; `ofelia.enabled=true`, Ofelia se re-apuntaba a él, el contenedor moría con `--rm`, y a partir de ahí
; TODOS los jobs fallaban para siempre con «No such container». Medido el 2026-07-26: 27 corridas
; fallidas contra 1 exitosa.
;
; Y el fallo era invisible: `IngestRun` existe para que un fallo silencioso se vuelva una fila roja en
; el Backoffice, pero no puede registrar un job que nunca llegó a arrancar. El log de ingesta se veía
; limpio porque no había nada que registrar.
;
; Apuntando por NOMBRE de contenedor, ningún efímero puede robarle el objetivo.
;
; EL ORDEN LO PONE EL COMANDO, NO EL RELOJ
; ----------------------------------------
; Ya no hay diez horarios encadenados: `refresh_daily` corre los pasos en orden y verifica el
; `IngestRun` de cada uno antes de seguir. Si una entrada falla, los derivados NO se reconstruyen.
; Era QA-01+ARCH-01 en `docs/TODO.md`, y quedó cerrado.
;
; LA OTRA PUERTA
; --------------
; El horario no decide solo. Todos estos comandos salvo `prune_ingest_log` consultan `seasons_dates`
; al despertar y no hacen nada fuera de temporada (ver `dglweb/stats/season_window.py`), dejando una
; fila `skipped` con el motivo. Los tres `*_post` usan además la ventana corta de octubre.
; ═══════════════════════════════════════════════════════════════════════════════════════════════

[global]
; A dónde va el registro de las corridas del propio scheduler.
save-folder = /tmp

; ── El refresco diario, en UN job ────────────────────────────────────────────────────────────────
;
; Antes eran diez horarios encadenados por reloj: 6:00 bateo, 6:15 pitcheo, 6:30 fildeo… y a las 7:30
; `build_leaders`, que corría pasara lo que pasara a las 6:30. Si el fildeo fallaba, los liderazgos
; se reconstruían igual mezclando dato nuevo con viejo, y nada lo decía.
;
; `refresh_daily` corre esos mismos pasos en orden y **no reconstruye lo derivado si las entradas no
; salieron bien**: prefiere dejar los liderazgos de ayer —viejos pero coherentes— antes que publicar
; unos nuevos calculados sobre insumos rotos. Publicar parcial existe, pero hay que pedirlo con
; `--publicar-parcial`.
;
; Deja UNA fila `refresh_daily` en el log de ingesta con el estado del día entero, además de la de
; cada paso. Eso es lo que faltaba: la entidad «el refresco del 26 de julio».
;
; LA HORA: 4:30 am dominicana. Ya no hacen falta las otras nueve — el orden lo pone el comando, no
; el reloj.
;
; Por qué 4:30 y no más temprano. En verano la hora dominicana coincide con la del Este, así que el
; juego nocturno de la costa del Pacífico empieza acá a las 22:15 — medido, es el inicio más tardío
; de las últimas dos semanas. Con tres horas de juego termina a la 1:15, y con entradas extra pasa
; poco de las 2:30. Las 4:30 dejan casi dos horas de margen sobre ese peor caso.
;
; Y por qué no más tarde: el refresco tarda 91 segundos, así que a las 4:32 el sitio ya amaneció con
; el dato del día — bastante antes de que nadie lo abra.

[job-exec "refresh-daily"]
schedule = 0 30 4 * * *
container = dglweb-web-live
command = python manage.py refresh_daily

; ── Cada hora ───────────────────────────────────────────────────────────────────────────────────

; Qué dominicanos están entre los diez primeros de las mayores. Va aparte del refresco diario porque
; no depende de nuestras tablas: sale del ranking que publica MLB, y ese sí cambia durante el día.
;
; Son dos llamadas al proxy —bateo y pitcheo— de poco más de medio segundo en total. Se persiste
; justamente para no consultarle a MLB en cada visita a la portada.
;
; Al minuto 20 y no en punto: a esa hora no compite con nada más del calendario.
[job-exec "mlb-leaders-hourly"]
schedule = 0 20 * * * *
container = dglweb-web-live
command = python manage.py build_mlb_leaders

; Los movimientos de roster que alimentan el cintillo de la cabecera.
;
; CADA HORA, TODO EL DÍA, y no un par de veces al día: un movimiento de las 3pm saldría al día
; siguiente. Se descartó acotarlo a 8am–6pm porque los juegos nocturnos terminan entre las 10 y las
; 11, y ahí caen lesiones y movimientos posteriores; con ese corte, una lista de lesionados de las
; 9pm aparecería a las 8 de la mañana como noticia fresca teniendo once horas.
;
; Cuesta UNA llamada por corrida —el endpoint acepta rangos de fechas, no hace falta preguntar equipo
; por equipo— así que son 24 al día. Para comparar: el job de líderes de aquí arriba hace 2 por
; corrida, o sea 48.
;
; Y el horario es solo una perilla de LATENCIA, no de correctitud: cada corrida pide los últimos dos
; días y guarda por el id de la transacción, así que una que falle no pierde nada.
;
; Al minuto 40, repartido con los otros dos horarios para no solaparse.
[job-exec "roster-moves-hourly"]
schedule = 0 40 * * * *
container = dglweb-web-live
command = python manage.py update_roster_moves

; Los destacados de la jornada EN CURSO, para que el widget de la portada deje de ser una foto de
; ayer que no se mueve en 24 horas.
;
; El refresco de las 4:30 sigue guardando la jornada completa de ayer; esto va añadiendo la de hoy
; según terminan los juegos. Guarda SOLO lo de los equipos cuyo juego acabó —`byDateRange` no
; distingue terminado de en curso— así que nunca publica una línea que todavía va a cambiar.
;
; Cuesta 2 llamadas por corrida, o sea 48 al día: exactamente lo mismo que el job de líderes de aquí
; arriba. Y a media mañana, sin ningún juego cerrado, ni siquiera llega a llamar: sale por el salto.
;
; CADA HORA, TODO EL DÍA, por la misma razón que los movimientos de roster: los juegos del Pacífico
; terminan pasada la una de la madrugada dominicana, y un corte por horario dejaría esas actuaciones
; fuera hasta la mañana siguiente — que es justo cuando dejan de ser noticia.
;
; Al minuto 50, repartido con los otros dos horarios para no solaparse.
[job-exec "daily-standouts-hourly"]
schedule = 0 50 * * * *
container = dglweb-web-live
command = python manage.py build_daily_standouts --fecha-hoy

; ── Semanal ─────────────────────────────────────────────────────────────────────────────────────

; Verifica los totales de carrera contra el proxy. Semanal porque es caro y no cambia a diario.
[job-exec "parity-career-weekly"]
schedule = 0 0 8 * * 0
container = dglweb-web-live
command = python manage.py parity_career

; La posición de cada pelotero contra la que dicen sus estadísticas. `pos` es la única columna del
; maestro que envejece sola: un campocorto se muda a segunda a los treinta, un abridor termina de
; cerrador. Medido el 2026-07-27: 96 de 981 ya no correspondían.
;
; SOLO INFORMA. `dgl_master` es la tabla del dueño, y un proceso semanal que sobrescriba por su
; cuenta puede pisar una corrección hecha a mano sin que nadie se entere. Para escribir hay que
; correrlo con `--aplicar`, a mano y a sabiendas.
;
; Semanal y no diario porque una posición no cambia de un martes a un miércoles: cambia a lo largo de
; una temporada. Media hora después de la paridad, para no solaparse.
[job-exec "check-positions-weekly"]
schedule = 0 30 8 * * 0
container = dglweb-web-live
command = python manage.py check_positions
