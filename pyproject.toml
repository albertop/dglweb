[project]
name = "dglweb"
version = "1.2026.22"
description = "Dominicanos en Grandes Ligas — website (Django + Wagtail)."
requires-python = ">=3.13"

# ---------------------------------------------------------------------------
# Ruff — lint + format (see docs/CODING_STANDARDS.md)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django settings use star-imports and re-order intentionally.
"config/settings/*" = ["F403", "F405", "E402"]
# Django's `class Meta` uses mutable class attributes (ordering, indexes…) by design.
"**/models.py" = ["RUF012"]
# Django dictates BaseCommand.handle(*args, **options) — its Any signature can't be narrowed.
"**/management/commands/*.py" = ["ANN401"]
# Tests and manage.py don't need full annotations on every callable.
"tests/**" = ["ANN"]
"manage.py" = ["ANN"]
"**/migrations/**" = ["ALL"]

# ---------------------------------------------------------------------------
# pytest / pytest-django
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
# `--ds` además del ini: el contenedor exporta DJANGO_SETTINGS_MODULE=config.settings.dev, y la
# variable de entorno le gana al ini. La línea de comandos le gana a las dos, así que esto es lo que
# garantiza que la suite corra contra su base descartable y nunca contra la real — ver
# `config/settings/test.py`.
addopts = "-v --strict-markers --tb=short --ds=config.settings.test --cov=dglweb --cov-report=term-missing -m 'not telegram'"

# El único marcador propio, y existe para que la suite NUNCA hable con Telegram sin que se lo pidan.
# `addopts` lo excluye por defecto; para correr esa comprobación hay que nombrarla:
#
#     pytest -m telegram
#
# Es la contrapartida de vaciar las credenciales en `config/settings/test.py`. Aquello garantiza que
# los tests normales no manden nada; esto deja una forma de comprobar que el canal SÍ funciona, que
# es la otra mitad — un canal de alertas que nadie verifica es un canal que se descubre roto el día
# que hacía falta.
markers = ["telegram: manda un mensaje REAL por Telegram. Excluido por defecto; se corre a mano."]

# ---------------------------------------------------------------------------
# mypy — strict, with the Django plugin (see library-guidelines.md).
# Tightened gradually; Wagtail is untyped so its imports are ignored.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
# `staticfiles/` es SALIDA de `collectstatic`, no código: es una copia de `static/`, y con la copia
# delante mypy ve dos módulos con el mismo nombre («Duplicate module named vendorizar») y se planta
# antes de revisar nada. Lo destapó construir la imagen de producción, que corre `collectstatic`.
exclude = ["migrations/", "staticfiles/"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[[tool.mypy.overrides]]
module = ["wagtail.*", "modelcluster.*", "taggit.*", "environ.*", "wagtail_footnotes.*"]
ignore_missing_imports = true

# Wagtail no publica tipos, así que para mypy sus clases son `Any`. Heredar de `Page` —que es lo que
# hace toda página del CMS— dispara `disallow_subclassing_any`, y cualquier valor que devuelva un
# método suyo dispara `warn_return_any`. Las dos son quejas sobre la librería y no sobre este código,
# así que se apagan SOLO en el módulo que define las páginas. El resto del proyecto sigue estricto.
[[tool.mypy.overrides]]
module = ["dglweb.articles.models", "dglweb.articles.blocks"]
disallow_subclassing_any = false
warn_return_any = false

# Tests are not a public interface; don't require return annotations on every test.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
