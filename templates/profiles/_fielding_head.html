{% comment %}Encabezado de una tabla de fildeo por temporada: prefijo Temporada/Equipo/Pos/Edad + cols.{% endcomment %}
<thead><tr>
  <th class="ps-3 dgl-mid">Temporada</th><th class="dgl-mid">Equipo</th><th class="dgl-mid">Pos</th><th>Edad</th>
  {% for c in cols %}<th{% if forloop.last %} class="pe-3"{% endif %}>{{ c.label }}</th>{% endfor %}
</tr></thead>
