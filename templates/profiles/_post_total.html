{% comment %}Gran total de postemporada como última fila de la tabla de detalle (no una tabla aparte).{% endcomment %}
<tr style="border-top:2px solid var(--dgl-navy); font-weight:700">
  <td class="ps-3 dgl-mid"><b>{{ entry.seasons }} temporada{{ entry.seasons|pluralize:"s" }}</b>{% if totals_target %}<br><button type="button" class="dgl-meta small dgl-linkbtn" onclick="dglShowPill('{{ totals_target }}')">desglose ▸</button>{% endif %}</td>
  <td class="dgl-mid"></td><td class="dgl-mid"></td>
  {% for cell in cells %}<td class="{{ cell.css }}{% if forloop.last %} pe-3{% endif %}">{{ cell.text }}</td>{% endfor %}
</tr>
